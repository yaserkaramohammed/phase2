events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    upstream django_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location /static/ {
            alias /static/;
        }

        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
