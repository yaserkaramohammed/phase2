name: Test - Image-First Pipeline

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput || true

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Build fresh application artifact
        run: |
          COMMIT_SHA=${{ github.sha }}
          ARTIFACT_NAME="app-${COMMIT_SHA:0:8}.tar.gz"
          tar -czf artifacts/$ARTIFACT_NAME \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='node_modules' \
            book_shop books dist nginx templates manage.py requirements.txt poetry.lock pyproject.toml .env.example || true
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "IMAGE_TAG=${COMMIT_SHA:0:8}" >> $GITHUB_ENV

      - name: Build Docker image from artifact
        run: docker build -t book-shop:test-latest . || echo "Docker build skipped"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Push image to ECR
        run: |
          docker tag book-shop:test-latest ${{ vars.REGISTRY_NAME }}:test-latest || echo "ECR push skipped"
          docker tag book-shop:test-latest ${{ vars.REGISTRY_NAME }}:${{ env.IMAGE_TAG }} || echo "ECR tag skipped"
          docker push ${{ vars.REGISTRY_NAME }}:test-latest || echo "ECR push failed"
          docker push ${{ vars.REGISTRY_NAME }}:${{ env.IMAGE_TAG }} || echo "ECR push failed"
        continue-on-error: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/book-shop
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{ vars.REGISTRY_NAME }}
            docker pull ${{ vars.REGISTRY_NAME }}:test-latest || true
            
            # Update docker-compose.yml with the new image tag
            sed -i "s|image:.*book-shop:.*|image: ${{ vars.REGISTRY_NAME }}:test-latest|g" docker-compose.yml
            
            docker-compose -p test down || true
            docker-compose -p test up -d
            echo "Test deployment successful!"
        continue-on-error: true
