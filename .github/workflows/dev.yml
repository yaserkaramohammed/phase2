name: Dev - Artifact-First Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput || true

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Build application artifact
        run: |
          COMMIT_SHA=${{ github.sha }}
          ARTIFACT_NAME="app-${COMMIT_SHA:0:8}.tar.gz"
          tar -czf artifacts/$ARTIFACT_NAME \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='node_modules' \
            book_shop books dist nginx templates manage.py requirements.txt poetry.lock pyproject.toml .env.example || true
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Commit and push artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "Add artifact ${{ env.ARTIFACT_NAME }}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:dev
          else
            echo "No new artifacts to commit"
          fi

      - name: Build Docker image from artifact
        run: docker build -t book-shop:dev-latest . || echo "Docker build skipped"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Push image to ECR
        run: |
          docker tag book-shop:dev-latest ${{ vars.REGISTRY_NAME }}:dev-latest || echo "ECR push skipped"
          docker push ${{ vars.REGISTRY_NAME }}:dev-latest || echo "ECR push failed, continuing"
        continue-on-error: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/book-shop
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{ vars.REGISTRY_NAME }}
            docker pull ${{ vars.REGISTRY_NAME }}:dev-latest || true
            
            # Update docker-compose.yml with the new image tag
            sed -i "s|image:.*book-shop:.*|image: ${{ vars.REGISTRY_NAME }}:dev-latest|g" docker-compose.yml
            
            docker-compose -p dev down || true
            docker-compose -p dev up -d
            echo "Dev deployment successful!"
        continue-on-error: true
