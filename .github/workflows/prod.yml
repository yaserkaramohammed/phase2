name: Prod - Promotion Only

on:
  push:
    branches:
      - prod

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Deploy from registry (Promotion Only - NO BUILD)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/book-shop
            
            # Login to ECR
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{ vars.REGISTRY_NAME }}
            
            # Read version from IMAGE_VERSION variable (SINGLE SOURCE OF TRUTH)
            IMAGE_VERSION="${{ vars.IMAGE_VERSION }}"
            echo "Deploying PROD with version: $IMAGE_VERSION"
            
            # Pull the tested image from ECR (NO BUILD - PROMOTION ONLY!)
            docker pull ${{ vars.REGISTRY_NAME }}:${IMAGE_VERSION} || true
            
            # Update docker-compose.yml with the promoted image tag
            sed -i "s|image:.*book-shop:.*|image: ${{ vars.REGISTRY_NAME }}:${IMAGE_VERSION}|g" docker-compose.yml
            
            # Stop old prod containers
            docker-compose -p prod down || true
            
            # Deploy with the promoted image
            docker-compose -p prod up -d
            
            echo "PROD deployment successful with version: $IMAGE_VERSION"
            echo "NO docker build was executed - promotion only!"
        continue-on-error: true
