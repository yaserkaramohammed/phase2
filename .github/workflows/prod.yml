name: Prod - Promotion Only

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy from registry (Promotion)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/book-shop || mkdir -p /home/ubuntu/book-shop && cd /home/ubuntu/book-shop
            docker login -u AWS -p $(aws ecr get-login-password --region eu-central-1) ${{ vars.REGISTRY_NAME }}
            
            # Pull the specific version from IMAGE_VERSION variable
            IMAGE_VERSION=${{ vars.IMAGE_VERSION }}
            docker pull ${{ vars.REGISTRY_NAME }}:${IMAGE_VERSION}
            
            # Stop old containers
            docker-compose -p prod down || true
            
            # Update docker-compose to use the promoted image
            cat > docker-compose.yml << COMPOSE_EOF
            version: '3.8'
            services:
              db:
                image: postgres:15
                environment:
                  POSTGRES_DB: book_shop
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                ports:
                  - "5433:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data

              backend:
                image: ${{ vars.REGISTRY_NAME }}:${IMAGE_VERSION}
                depends_on:
                  - db
                environment:
                  SECRET_KEY: ${{ secrets.SECRET_KEY }}
                  POSTGRES_DB: book_shop
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  ALLOWED_HOSTS: "*"
                ports:
                  - "8001:8000"

              nginx:
                image: nginx:latest
                depends_on:
                  - backend
                ports:
                  - "8080:80"
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                  - ./dist:/usr/share/nginx/html:ro

            volumes:
              postgres_data:
            COMPOSE_EOF
            
            # Start new containers
            docker-compose -p prod up -d
